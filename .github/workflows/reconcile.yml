name: Reconcile OmniSeed Ecosystem

on:
  pull_request:
    paths: [omniform.yaml, package.json, package-lock.json, scripts/**, test/**, .github/workflows/reconcile.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Ordinary governed reconciliation operation
        required: true
        default: plan
        type: choice
        options: [plan, observe]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm test

  reconcile:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: { repository: mikeajijola/omniseed-provider-github, ref: 1207b6f682469c9738815e5932904626df2d6402, path: providers/github }
      - uses: actions/checkout@v6
        with: { repository: mikeajijola/omniseed-provider-vercel, ref: 3d90845f1b73ccd87545595cf041c305ddbd739c, path: providers/vercel }
      - uses: actions/checkout@v6
        with: { repository: mikeajijola/omniseed-provider-neon, ref: 2ad0bfaef3ac17f03397719afdc7cc6e0cded9bc, path: providers/neon }
      - uses: actions/checkout@v6
        with: { repository: mikeajijola/omniseed-provider-omniseed, ref: 9e12f26ec03a09106db1ab20d154b8f88c6c832e, path: providers/omniseed }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - name: Assemble installed Provider configuration
        env:
          OMNISEED_PROVIDER_ROOT: ${{ github.workspace }}/providers
          OMNISEED_DESIRED_REVISION: ${{ github.sha }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          NEON_PROJECT_NAME: ${{ vars.NEON_PROJECT_NAME }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_ORGANISATION_ID: ${{ vars.NEON_ORGANISATION_ID }}
          NEON_REGION_ID: ${{ vars.NEON_REGION_ID }}
          NEON_POSTGRES_VERSION: ${{ vars.NEON_POSTGRES_VERSION }}
        run: node scripts/provider-configuration.mjs provider-configuration.json
      - name: Invoke ordinary governed reconciliation
        env:
          OMNISEED_DESIRED_REVISION: ${{ github.sha }}
          OMNISEED_ENVIRONMENT: production
          OMNISEED_STATE_ENDPOINT: ${{ vars.OMNISEED_STATE_ENDPOINT }}
          OMNISEED_STATE_TOKEN: ${{ secrets.OMNISEED_STATE_TOKEN }}
          OMNISEED_PROVIDER_CONFIGURATION_FILE: provider-configuration.json
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OMNISEED_OPERATOR_TOKEN: ${{ secrets.OMNISEED_OPERATOR_TOKEN }}
          OMNISEED_OPERATION_TOKEN: ${{ secrets.OMNISEED_OPERATION_TOKEN }}
          OMNISEED_PROVIDER_OPERATION_TOKEN: ${{ secrets.OMNISEED_OPERATION_TOKEN }}
          LILY_RUNTIME_OBSERVATION_TOKEN: ${{ secrets.LILY_RUNTIME_OBSERVATION_TOKEN }}
          RECONCILIATION_OPERATION: ${{ inputs.operation }}
        run: node scripts/reconcile.mjs "$RECONCILIATION_OPERATION"
