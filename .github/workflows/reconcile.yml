name: Reconcile OmniSeed Ecosystem

on:
  pull_request:
    paths: [omniform.yaml, package.json, package-lock.json, scripts/**, test/**, .github/workflows/reconcile.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Ordinary governed reconciliation operation
        required: true
        default: plan
        type: choice
        options: [plan, apply, bootstrap, observe]
      approved_plan_id:
        description: Exact persisted plan ID reviewed before apply (or bootstrap)
        required: false
        type: string
      approved_plan_hash:
        description: Exact persisted plan hash reviewed before apply (or bootstrap)
        required: false
        type: string
      approved_resources:
        description: Comma-separated declared resource IDs approved from that plan
        required: false
        type: string
      bootstrap_preview:
        description: Generate the first reviewed plan from empty runtime state before the declared state service exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm test

  reconcile:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: { repository: mikeajijola/omniseed-provider-github, ref: 1207b6f682469c9738815e5932904626df2d6402, path: providers/github }
      - uses: actions/checkout@v6
        with: { repository: mikeajijola/omniseed-provider-vercel, ref: 18f30fe3c33f0fb22e85b545b02ab4c5e1b8c6a4, path: providers/vercel }
      - uses: actions/checkout@v6
        with: { repository: mikeajijola/omniseed-provider-neon, ref: 2ad0bfaef3ac17f03397719afdc7cc6e0cded9bc, path: providers/neon }
      - uses: actions/checkout@v6
        with: { repository: mikeajijola/omniseed-provider-omniseed, ref: 9e12f26ec03a09106db1ab20d154b8f88c6c832e, path: providers/omniseed }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - name: Verify Vercel production credential boundary
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_STATUS_PROJECT_ID: ${{ vars.VERCEL_STATUS_PROJECT_ID }}
        run: |
          project_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_STATUS_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}")"
          if [ "$project_status" != "200" ]; then
            echo "::error::Vercel project-scope probe failed (HTTP ${project_status})."
            exit 1
          fi
      - name: Assemble installed Provider configuration
        env:
          OMNISEED_PROVIDER_ROOT: ${{ github.workspace }}/providers
          OMNISEED_DESIRED_REVISION: ${{ github.sha }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_STATUS_PROJECT_ID: ${{ vars.VERCEL_STATUS_PROJECT_ID }}
          NEON_PROJECT_NAME: ${{ vars.NEON_PROJECT_NAME }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_ORGANISATION_ID: ${{ vars.NEON_ORGANISATION_ID }}
          NEON_REGION_ID: ${{ vars.NEON_REGION_ID }}
          NEON_POSTGRES_VERSION: ${{ vars.NEON_POSTGRES_VERSION }}
        run: node scripts/provider-configuration.mjs provider-configuration.json
      - name: Invoke ordinary governed reconciliation
        env:
          OMNISEED_DESIRED_REVISION: ${{ github.sha }}
          OMNISEED_ENVIRONMENT: production
          OMNISEED_STATE_ENDPOINT: ${{ vars.OMNISEED_STATE_ENDPOINT }}
          OMNISEED_STATE_TOKEN: ${{ secrets.OMNISEED_STATE_TOKEN }}
          OMNISEED_PROVIDER_CONFIGURATION_FILE: provider-configuration.json
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OMNISEED_OPERATOR_TOKEN: ${{ secrets.OMNISEED_OPERATOR_TOKEN }}
          OMNISEED_OPERATION_TOKEN: ${{ secrets.OMNISEED_OPERATION_TOKEN }}
          OMNISEED_PROVIDER_OPERATION_TOKEN: ${{ secrets.OMNISEED_OPERATION_TOKEN }}
          LILY_RUNTIME_OBSERVATION_TOKEN: ${{ secrets.LILY_RUNTIME_OBSERVATION_TOKEN }}
          RECONCILIATION_OPERATION: ${{ inputs.operation }}
          OMNISEED_BOOTSTRAP_PREVIEW: ${{ inputs.bootstrap_preview }}
          OMNISEED_APPROVED_PLAN_ID: ${{ inputs.approved_plan_id }}
          OMNISEED_APPROVED_PLAN_HASH: ${{ inputs.approved_plan_hash }}
          OMNISEED_APPROVED_RESOURCES: ${{ inputs.approved_resources }}
          OMNISEED_APPROVER_IDENTITY: operator_identities
          OMNISEED_APPROVER_PRINCIPAL: ${{ github.actor }}
        run: node scripts/reconcile.mjs "$RECONCILIATION_OPERATION"
