name: Validate desired state

on:
  pull_request:
    paths:
      - omniform.yaml
      - package.json
      - package-lock.json
      - .github/workflows/validate.yml

permissions:
  contents: read

jobs:
  omniform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
