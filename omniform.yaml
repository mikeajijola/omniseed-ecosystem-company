apiVersion: omniform.org/v1alpha1
kind: Company
metadata:
  id: omniseed_ecosystem
  name: OmniSeed Ecosystem
  labels: { instance: production_reference }
spec:
  intent: Build, govern, operate, and improve the public OmniSeed Company-as-Code ecosystem.
  governance:
    desiredState:
      repository: https://github.com/mikeajijola/omniseed-ecosystem-company.git
      branch: main
      path: omniform.yaml
      changeMode: pull_request
  stewardship:
    capability: steward_omniseed_ecosystem
    realisation: lily_stewardship
  outcomes:
    - id: truthful_self_hosting
      description: OmniSeed can explain with evidence how its own ecosystem company is run.
  providers:
    agents: { provider: vercel }
    skills: { provider: omniseed }
    connectors: { provider: vercel }
    workflows: { provider: github }
    policies: { provider: omniseed }
    observations: { provider: omniseed }
    memory: { provider: omnicede }
    identity: { provider: github }
    inference: { provider: google }
  capabilities:
    - id: steward_omniseed_ecosystem
      name: Steward OmniSeed Ecosystem
      description: Maintain situational awareness and exercise authorised company-management capabilities in pursuit of approved desired state.
      autonomy: { mode: recommend }
      requires:
        - { id: stewardship_agency, primitiveFamily: agents }
        - { id: company_reasoning, primitiveFamily: skills }
        - { id: governed_operations_access, primitiveFamily: connectors }
        - { id: governed_change_process, primitiveFamily: workflows }
        - { id: stewardship_authority, primitiveFamily: policies }
        - { id: company_state_observation, primitiveFamily: observations }
        - { id: organisational_context, primitiveFamily: memory }
        - { id: steward_identity, primitiveFamily: identity }
        - id: stewardship_inference
          primitiveFamily: inference
      realisations: [lily_stewardship]
    - id: maintain_omniseed_engine
      name: Maintain OmniSeed Engine
      requires:
        - { id: engineering_agency, primitiveFamily: agents }
        - { id: software_engineering, primitiveFamily: skills }
        - { id: repository_access, primitiveFamily: connectors }
        - { id: software_change_manage, primitiveFamily: workflows }
        - { id: required_review, primitiveFamily: policies }
        - { id: change_observation, primitiveFamily: observations }
        - { id: engineering_history, primitiveFamily: memory }
        - { id: contributor_identity, primitiveFamily: identity }
      realisations: [engine_development]
    - id: validate_ecosystem_conformance
      name: Validate Ecosystem Conformance
      requires:
        - { id: conformance_skill, primitiveFamily: skills }
        - { id: public_repository_access, primitiveFamily: connectors }
        - { id: conformance_workflow, primitiveFamily: workflows }
        - { id: invariant_policy, primitiveFamily: policies }
        - { id: conformance_observation, primitiveFamily: observations }
      realisations: [public_conformance]
    - id: operate_omniseed_ecosystem
      name: Operate OmniSeed Ecosystem
      description: Give authorised people an optional first-party environment for inspecting and operating the company.
      requires:
        - { id: human_operating_interface, primitiveFamily: connectors }
        - { id: operator_identity, primitiveFamily: identity }
        - { id: interface_authority, primitiveFamily: policies }
        - { id: interface_health_observation, primitiveFamily: observations }
      realisations: [omniseed_os_interface]
    - id: reconcile_omniseed_ecosystem
      name: Reconcile OmniSeed Ecosystem
      description: Converge approved Git-backed desired company state through governed planning, Provider execution, observation, drift detection, and durable evidence.
      autonomy: { mode: plan }
      requires:
        - { id: approved_desired_state_resolution, primitiveFamily: workflows }
        - { id: deterministic_reconciliation, primitiveFamily: workflows }
        - { id: provider_operation_boundary, primitiveFamily: connectors }
        - { id: reconciliation_authority, primitiveFamily: policies }
        - { id: runtime_state_continuity, primitiveFamily: memory }
        - { id: reconciliation_observation, primitiveFamily: observations }
        - { id: reconciler_identity, primitiveFamily: identity }
      realisations: [ecosystem_reconciliation]
  realisations:
    - id: lily_stewardship
      name: Lily reference stewardship
      capability: steward_omniseed_ecosystem
      participants:
        - { resource: lily, role: steward, supplies: [stewardship_agency] }
        - { resource: stewardship_skills, supplies: [company_reasoning] }
        - { resource: omniseed_os, supplies: [governed_operations_access] }
        - { resource: company_change_workflow, supplies: [governed_change_process] }
        - { resource: lily_authority, supplies: [stewardship_authority] }
        - { resource: company_observer, supplies: [company_state_observation] }
        - { resource: ecosystem_memory, supplies: [organisational_context] }
        - { resource: lily_identity, supplies: [steward_identity] }
        - resource: lily_inference
          supplies:
            - stewardship_inference
    - id: engine_development
      name: Engine development, review, and release
      capability: maintain_omniseed_engine
      participants:
        - { resource: ecosystem_contributors, supplies: [engineering_agency] }
        - { resource: engineering_skills, supplies: [software_engineering] }
        - { resource: github_repositories, supplies: [repository_access] }
        - { resource: github_change_workflow, supplies: [software_change_manage] }
        - { resource: review_policy, supplies: [required_review] }
        - { resource: change_observer, supplies: [change_observation] }
        - { resource: ecosystem_memory, supplies: [engineering_history] }
        - { resource: contributor_identities, supplies: [contributor_identity] }
    - id: public_conformance
      name: Public ecosystem conformance
      capability: validate_ecosystem_conformance
      participants:
        - { resource: conformance_runner, supplies: [conformance_skill] }
        - { resource: github_repositories, supplies: [public_repository_access] }
        - { resource: github_conformance_workflow, supplies: [conformance_workflow] }
        - { resource: invariant_catalogue, supplies: [invariant_policy] }
        - { resource: conformance_observer, supplies: [conformance_observation] }
    - id: omniseed_os_interface
      name: OmniSeed OS human interface
      capability: operate_omniseed_ecosystem
      participants:
        - { resource: omniseed_os, role: human_interface, supplies: [human_operating_interface] }
        - { resource: operator_identities, supplies: [operator_identity] }
        - { resource: interface_policy, supplies: [interface_authority] }
        - { resource: os_observer, supplies: [interface_health_observation] }
    - id: ecosystem_reconciliation
      name: Git-governed OmniSeed reconciliation
      capability: reconcile_omniseed_ecosystem
      participants:
        - { resource: ecosystem_reconciliation_workflow, supplies: [approved_desired_state_resolution, deterministic_reconciliation] }
        - { resource: omniseed_os, supplies: [provider_operation_boundary] }
        - { resource: reconciliation_policy, supplies: [reconciliation_authority] }
        - { resource: engine_runtime_state, supplies: [runtime_state_continuity] }
        - { resource: reconciliation_observer, supplies: [reconciliation_observation] }
        - { resource: reconciler_identity, supplies: [reconciler_identity] }
  resources:
    agents:
      - id: lily
        name: Lily
        provider: vercel
        offers: [stewardship_agency]
        risk: high
        spec:
          authority:
            - company.read
            - capability.read
            - realisation.read
            - provider_binding.read
            - activity.read
            - company_change.propose
            - company_change.read
            - company_change.apply
            - company_change.merge
            - plan.create
            - plan.read
            - plan.apply
            - state.reconcile
            - company_work.create
            - company_work.read
            - company_work.record
            - company_work.cancel
          bootstrap:
            company: omniseed_ecosystem
            credentialReference: OMNISEED_OPERATION_TOKEN
            identity: lily
            omniseedEndpoint: https://omniseed-ecosystem-os.vercel.app
            runtimeModelConfiguration: LILY_MODEL
          implementation:
            framework: eve
            model: gemini-2.5-flash
            repository: https://github.com/mikeajijola/omniseed-lily.git
            repositoryId: 1335525492
            revision: c1b402c9342c5b33e9c45878219c8df39400913c
          kind: ai_agent
          organisationalIdentity: lily
          runtime:
            environment: production
            expectedEndpoints:
              health: https://omniseed-ecosystem-os.vercel.app/health
              info: https://omniseed-ecosystem-os.vercel.app/info
              operation: https://omniseed-ecosystem-os.vercel.app/eve/v1/session
            project: omniseed-ecosystem-os
            provider: vercel
            providerRevision: 40696040fb9fe954afe271189063a13f9aeec1b9
            observationCredentialReference: LILY_RUNTIME_OBSERVATION_TOKEN
            source:
              repository: https://github.com/mikeajijola/omniseedos.git
              repositoryId: 1326313594
              revision: e3628b67d19c302a0d6b94f31cc31ccfbe608b8e
            secretReferences:
              - DATABASE_URL
              - OMNISEED_OPERATION_TOKEN
              - OMNISEED_OPERATOR_TOKEN
              - OMNISEED_STATE_TOKEN
              - LILY_SESSION_JWT_SECRET
              - LILY_RUNTIME_OBSERVATION_TOKEN
              - GITHUB_PROVIDER_TOKEN
              - GOOGLE_GENERATIVE_AI_API_KEY
            session:
              credentialReference: LILY_SESSION_JWT_SECRET
              issuer: omniseed
              audience: omniseed-lily
              subject: omniseed-os:omniseed_ecosystem
            services:
              - functions
      - { id: ecosystem_contributors, name: Ecosystem Contributors, offers: [engineering_agency], spec: { kind: people_and_agents } }
    skills:
      - { id: stewardship_skills, name: Stewardship Skills, provider: omniseed, offers: [company_reasoning], spec: { abilities: [inspect, reason, explain, propose, delegate, escalate] } }
      - { id: engineering_skills, name: Software Engineering Skills, provider: omniseed, offers: [software_engineering] }
      - { id: conformance_runner, name: Ecosystem Conformance Runner, provider: omniseed, offers: [conformance_skill] }
    connectors:
      - { id: github_repositories, name: Public Repository Boundary, provider: github, offers: [repository_access, public_repository_access] }
      - id: omniseed_os
        name: OmniSeed OS
        provider: vercel
        offers:
          - human_operating_interface
          - governed_operations_access
          - provider_operation_boundary
        spec:
          access:
            stewardChat: public
          secretReferences:
            - LILY_SESSION_JWT_SECRET
            - GITHUB_PROVIDER_TOKEN
          companyBinding:
            companyId: omniseed_ecosystem
            path: omniform.yaml
            readOnlyInspection: false
            repository: https://github.com/mikeajijola/omniseed-ecosystem-company.git
            stewardActorId: lily
          durableState:
            credentialReferences:
              - DATABASE_URL
              - OMNISEED_STATE_TOKEN
              - OMNISEED_OPERATOR_TOKEN
              - OMNISEED_OPERATION_TOKEN
            endpoint: https://omniseed-ecosystem-os.vercel.app/api/state
            implementationRevision: e3628b67d19c302a0d6b94f31cc31ccfbe608b8e
            provider: neon
            service: postgresql
          environment: production
          expectedEndpoints:
            company: https://omniseed-ecosystem-os.vercel.app/api/company
            health: https://omniseed-ecosystem-os.vercel.app/api/health
            operations: https://omniseed-ecosystem-os.vercel.app
          optional: true
          implementation:
            package: "@omniseed/os"
            version: 1.0.0-alpha.37
          project: omniseed-ecosystem-os
          provider: vercel
          providerRevision: 40696040fb9fe954afe271189063a13f9aeec1b9
          services:
            - functions
            - deployment
          source:
            repository: https://github.com/mikeajijola/omniseedos.git
            repositoryId: 1326313594
            revision: e3628b67d19c302a0d6b94f31cc31ccfbe608b8e
    workflows:
      - id: company_change_workflow
        name: Company Change Workflow
        provider: github
        offers: [governed_change_process]
        spec:
          provider: github
          providerRevision: b1e1a42883a2c0f3e439d340eff0816ca02d3025
          products: [Repositories, Pull Requests, Checks, Apps/API]
          repository: mikeajijola/omniseed-ecosystem-company
          baseBranch: main
          path: omniform.yaml
          branchPrefix: omniseed/
          credentialReference: GITHUB_PROVIDER_TOKEN
          mergePolicy:
            requireApproval: true
            requirePassingChecks: true
            trustedApprovalChecks:
              - { name: governed-company-change-approval, appSlug: github-actions }
            mergeMethod: squash
      - { id: github_change_workflow, name: GitHub Change Workflow, provider: github, offers: [software_change_manage] }
      - { id: github_conformance_workflow, name: GitHub Conformance Workflow, provider: github, offers: [conformance_workflow] }
      - id: ecosystem_reconciliation_workflow
        name: Ecosystem Reconciliation Workflow
        provider: github
        offers: [approved_desired_state_resolution, deterministic_reconciliation]
        risk: high
        spec:
          implementation:
            enginePackage: "@omniseed/engine"
            engineVersion: 1.0.0-alpha.20
            lifecycle: [load, compile, plan, approve, apply, observe, persist, compile]
            product: GitHub Actions
            sourceRevision: 9713dd4dfcbb36de9f21524f1ba4203f3b0fe41b
          source:
            repository: https://github.com/mikeajijola/omniseed-ecosystem-company.git
            branch: main
            path: omniform.yaml
          triggers: [governed_dispatch]
    policies:
      - { id: lily_authority, name: Lily Authority, provider: omniseed, offers: [stewardship_authority], spec: { deny: [ approve, self_escalate, direct_provider_mutation ], allow: [ read, propose, apply_after_independent_approval, provider_merge_after_policy, observe ] } }
      - { id: review_policy, name: Required Review, provider: omniseed, offers: [required_review], spec: { pullRequestRequired: true } }
      - { id: invariant_catalogue, name: Ecosystem Invariants, provider: omniseed, offers: [invariant_policy] }
      - { id: interface_policy, name: Interface Authority Policy, provider: omniseed, offers: [interface_authority], spec: { stewardChat: public, mutationsRequireGovernedOperations: true } }
      - id: reconciliation_policy
        name: Reconciliation Authority Policy
        provider: omniseed
        offers: [reconciliation_authority]
        spec:
          requireExactPlanApproval: true
          forbidSelfApproval: true
          observeAfterApply: true
    observations:
      - { id: company_observer, name: Company State Observer, provider: omniseed, offers: [company_state_observation] }
      - { id: change_observer, name: Change Observer, provider: omniseed, offers: [change_observation] }
      - { id: conformance_observer, name: Conformance Observer, provider: omniseed, offers: [conformance_observation] }
      - { id: os_observer, name: OS Observer, provider: omniseed, offers: [interface_health_observation] }
      - id: reconciliation_observer
        name: Reconciliation Observer
        provider: omniseed
        offers: [reconciliation_observation]
        spec:
          measures: [desired_revision, observed_revision, provider_state, drift, evidence]
    memory:
      - id: ecosystem_memory
        name: Ecosystem Organisational Memory
        provider: omnicede
        offers: [organisational_context, engineering_history]
        spec:
          implementation:
            product: Omnicede embedded graph memory
            protocol: omniseed.provider.protocol/1.0
            repository: https://github.com/mikeajijola/omnicede.git
            revision: 914e3434503ec4ae1a911816082b06470daa56a1
          persistence:
            kind: sqlite
            durability: required
          expectedObservation:
            type: omnicede_memory_state
            evidenceType: omnicede_memory_observation
      - id: engine_runtime_state
        name: Durable OmniSeed Runtime State
        provider: neon
        offers: [runtime_state_continuity]
        risk: high
        spec:
          canonicalDesiredState: false
          projectName: omniseed-ecosystem-runtime
          implementation:
            repository: https://github.com/mikeajijola/omniseed-provider-neon.git
            revision: 2ad0bfaef3ac17f03397719afdc7cc6e0cded9bc
          consistency: optimistic_concurrency
          credentialReferences: [DATABASE_URL, OMNISEED_STATE_TOKEN]
          product: PostgreSQL
          requiredRecords: [ company_binding, desired_revision, observed_revision, plans, approvals, provider_actions, observations, evidence, activity, reconciliation_history, company_work_runs, agent_session_cursor ]
    identity:
      - { id: lily_identity, name: Lily Organisational Identity, offers: [steward_identity] }
      - { id: contributor_identities, name: Contributor Identities, offers: [contributor_identity] }
      - { id: operator_identities, name: Operator Identities, offers: [operator_identity], spec: { authority: [plan.approve, company_change.approve, company_change.apply, company_change.merge] } }
      - { id: reconciler_identity, name: Reconciler Service Identity, provider: github, offers: [reconciler_identity], spec: { product: GitHub Actions OIDC, authority: [company.bind, plan.create, plan.apply, state.reconcile], selfApproval: false } }
    inference:
      - { id: lily_inference, name: Lily Gemini inference, risk: high, spec: { model: gemini-2.5-flash, product: Gemini API, providerRevision: a94e6101214d807897ca701e5b96050d7de054d7, credentialReference: GOOGLE_GENERATIVE_AI_API_KEY }, offers: [ stewardship_inference ], provider: google }
  operations:
    - { id: inspect_company, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Inspect desired and observed company state, permissions: [ company.read ] }
    - { id: get_capability, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Inspect a capability trace, permissions: [ capability.read ] }
    - { id: inspect_realisation, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: "Inspect a realisation through primitive participants, Provider bindings, observations, and evidence", permissions: [ realisation.read ] }
    - { id: inspect_provider_binding, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Inspect the Provider organisation selected at a primitive boundary, permissions: [ provider_binding.read ] }
    - { id: list_activity, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Inspect evidence-backed company Activity including durable Agent work, permissions: [ activity.read ] }
    - { id: start_company_work, input: {}, output: {}, approval: none, mutation: true, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api ], description: Start a durable company-work run for the declared steward, permissions: [ company_work.create ] }
    - { id: list_company_work, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api ], description: List durable company-work runs, permissions: [ company_work.read ] }
    - { id: get_company_work, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api ], description: Inspect a safe company-work timeline projection, permissions: [ company_work.read ] }
    - { id: continue_company_work, input: {}, output: {}, approval: none, mutation: true, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api ], description: Resume the same durable steward session after input or a governance event, permissions: [ company_work.create ] }
    - { id: cancel_company_work, input: {}, output: {}, approval: none, mutation: true, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api ], description: Cancel active steward work without changing desired state, permissions: [ company_work.cancel ] }
    - { id: propose_company_change, input: {}, output: {}, approval: none, mutation: true, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Propose a PR-governed desired-state change, permissions: [ company_change.propose ] }
    - { id: inspect_company_change, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Inspect company change proposals, permissions: [ company_change.read ] }
    - { id: preview_company_change, input: {}, output: {}, approval: none, mutation: false, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Validate and inspect the impact of an exact persisted company change without mutation, permissions: [ company_change.read ] }
    - { id: approve_company_change, input: {}, output: {}, approval: required, mutation: true, capability: steward_omniseed_ecosystem, interfaces: [ ui, api, cli, agent ], description: Approve an exact company change, permissions: [ company_change.approve ] }
    - { id: apply_company_change, input: {}, output: {}, approval: required, mutation: true, capability: steward_omniseed_ecosystem, interfaces: [ ui, api, cli, agent ], description: Submit an approved company change as a pull request, permissions: [ company_change.apply ] }
    - { id: merge_company_change, input: {}, output: {}, approval: required, mutation: true, capability: steward_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent ], description: Merge an unchanged approved company-change pull request after Provider-observed review and checks satisfy policy, permissions: [ company_change.merge ] }
    - { id: generate_plan, input: {}, output: {}, approval: none, mutation: false, capability: reconcile_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Generate and persist a deterministic reconciliation plan from approved desired state and current observed state, permissions: [ plan.create ] }
    - { id: get_plan, input: {}, output: {}, approval: none, mutation: false, capability: reconcile_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Inspect an exact persisted reconciliation plan and its independent approval, permissions: [ plan.read ] }
    - { id: apply_plan, input: {}, output: {}, approval: required, mutation: true, capability: reconcile_omniseed_ecosystem, interfaces: [ ui, api, cli, agent, machine ], description: Apply only actions from an exact persisted and approved reconciliation plan, permissions: [ plan.apply ] }
    - { id: observe_company, input: {}, output: {}, approval: policy, mutation: true, capability: reconcile_omniseed_ecosystem, interfaces: [ lily, ui, api, cli, agent, machine ], description: Observe deployed primitive resources through their selected Providers and persist evidence without changing desired state, permissions: [ state.reconcile ] }
    - { id: bind_company, input: {}, output: {}, approval: policy, mutation: true, capability: reconcile_omniseed_ecosystem, interfaces: [ api, cli, machine ], description: Bind this runtime to an exact approved merged desired revision without copying the company definition into runtime state, permissions: [ company.bind ] }
