apiVersion: omniform.org/v1alpha1
kind: Company
metadata:
  id: omniseed_ecosystem
  name: OmniSeed Ecosystem
  labels: { instance: production_reference }
spec:
  intent: Build, govern, grow, distribute, support, and sustain the public OmniSeed Company-as-Code ecosystem as an operating business.
  governance:
    desiredState:
      repository: https://github.com/mikeajijola/omniseed-ecosystem-company.git
      branch: main
      path: omniform.yaml
      changeMode: pull_request
  stewardship:
    capability: steward_omniseed_ecosystem
    realisation: lily_stewardship
  outcomes:
    - id: truthful_self_hosting
      description: OmniSeed can explain with evidence how its own ecosystem company is run.
    - id: sustainable_ecosystem_business
      description: OmniSeed can develop, distribute, support, govern, and commercialise its ecosystem without hiding capability gaps.
  providers:
    agents: { provider: vercel }
    skills: { provider: omniseed }
    connectors: { provider: vercel }
    workflows: { provider: github }
    policies: { provider: omniseed }
    observations: { provider: omniseed }
    memory: { provider: neon }
    identity: { provider: github }
    inference: { provider: google }
  capabilities:
    - id: steward_omniseed_ecosystem
      name: Steward OmniSeed Ecosystem
      description: Maintain situational awareness and exercise authorised company-management capabilities in pursuit of approved desired state.
      autonomy: { mode: recommend }
      requires:
        - { id: stewardship_agency, primitiveFamily: agents }
        - { id: company_reasoning, primitiveFamily: skills }
        - { id: governed_operations_access, primitiveFamily: connectors }
        - { id: governed_change_process, primitiveFamily: workflows }
        - { id: stewardship_authority, primitiveFamily: policies }
        - { id: company_state_observation, primitiveFamily: observations }
        - { id: organisational_context, primitiveFamily: memory }
        - { id: steward_identity, primitiveFamily: identity }
        - id: stewardship_inference
          primitiveFamily: inference
      realisations: [lily_stewardship]
    - id: maintain_omniseed_engine
      name: Maintain OmniSeed Engine
      description: Maintain, review, and release the core Engine that resolves and reconciles implementation-independent company declarations.
      requires:
        - { id: engineering_agency, primitiveFamily: agents }
        - { id: software_engineering, primitiveFamily: skills }
        - { id: repository_access, primitiveFamily: connectors }
        - { id: software_change_manage, primitiveFamily: workflows }
        - { id: required_review, primitiveFamily: policies }
        - { id: change_observation, primitiveFamily: observations }
        - { id: engineering_history, primitiveFamily: memory }
        - { id: contributor_identity, primitiveFamily: identity }
      realisations: [engine_development]
    - id: validate_ecosystem_conformance
      name: Validate Ecosystem Conformance
      description: Verify public ecosystem components against shared contracts and architectural invariants.
      requires:
        - { id: conformance_skill, primitiveFamily: skills }
        - { id: public_repository_access, primitiveFamily: connectors }
        - { id: conformance_workflow, primitiveFamily: workflows }
        - { id: invariant_policy, primitiveFamily: policies }
        - { id: conformance_observation, primitiveFamily: observations }
      realisations: [public_conformance]
    - id: operate_omniseed_ecosystem
      name: Operate OmniSeed Ecosystem
      description: Give authorised people an optional first-party environment for inspecting and operating the company.
      requires:
        - { id: human_operating_interface, primitiveFamily: connectors }
        - { id: operator_identity, primitiveFamily: identity }
        - { id: interface_authority, primitiveFamily: policies }
        - { id: interface_health_observation, primitiveFamily: observations }
      realisations: [omniseed_os_interface]
    - id: reconcile_omniseed_ecosystem
      name: Reconcile OmniSeed Ecosystem
      description: Converge approved Git-backed desired company state through governed planning, Provider execution, observation, drift detection, and durable evidence.
      autonomy: { mode: plan }
      requires:
        - { id: approved_desired_state_resolution, primitiveFamily: workflows }
        - { id: deterministic_reconciliation, primitiveFamily: workflows }
        - { id: provider_operation_boundary, primitiveFamily: connectors }
        - { id: reconciliation_authority, primitiveFamily: policies }
        - { id: runtime_state_continuity, primitiveFamily: memory }
        - { id: reconciliation_observation, primitiveFamily: observations }
        - { id: reconciler_identity, primitiveFamily: identity }
      realisations: [ecosystem_reconciliation]
    # Strategy and company governance
    - id: set_company_strategy_and_governance
      name: Set Company Strategy and Governance
      description: Define OmniSeed's direction, outcomes, decision rights, portfolio priorities, and accountable governance.
      autonomy: { mode: recommend }
      requires:
        - { id: strategy_and_governance_agency, primitiveFamily: agents }
        - { id: strategic_planning_and_governance, primitiveFamily: skills }
        - { id: governed_strategy_decisions, primitiveFamily: workflows }
        - { id: decision_rights_and_guardrails, primitiveFamily: policies }
        - { id: strategy_performance_observation, primitiveFamily: observations }
        - { id: strategic_context, primitiveFamily: memory }
    # Product and roadmap management
    - id: manage_product_and_roadmap
      name: Manage Product and Roadmap
      description: Discover user needs and govern coherent roadmaps for Omniform, the Engine, OmniSeed OS, and ecosystem services.
      requires:
        - { id: product_management_agency, primitiveFamily: agents }
        - { id: product_discovery_and_prioritisation, primitiveFamily: skills }
        - { id: roadmap_governance, primitiveFamily: workflows }
        - { id: product_feedback_access, primitiveFamily: connectors }
        - { id: product_outcome_observation, primitiveFamily: observations }
        - { id: product_knowledge, primitiveFamily: memory }
    # Product engineering and release
    - id: engineer_and_release_omniseed_products
      name: Engineer and Release OmniSeed Products
      description: Design, build, verify, package, and release the Engine, OS, Omniform, and related public product components.
      requires:
        - { id: product_engineering_agency, primitiveFamily: agents }
        - { id: product_engineering_and_release, primitiveFamily: skills }
        - { id: product_source_and_distribution_access, primitiveFamily: connectors }
        - { id: verified_release_process, primitiveFamily: workflows }
        - { id: release_quality_policy, primitiveFamily: policies }
        - { id: release_observation, primitiveFamily: observations }
    # Provider ecosystem
    - id: grow_and_manage_provider_ecosystem
      name: Grow and Manage Provider Ecosystem
      description: Discover, qualify, integrate, document, review, and retire Provider implementations across primitive families.
      requires:
        - { id: provider_ecosystem_agency, primitiveFamily: agents }
        - { id: provider_discovery_and_lifecycle, primitiveFamily: skills }
        - { id: provider_integration_access, primitiveFamily: connectors }
        - { id: provider_qualification_lifecycle, primitiveFamily: workflows }
        - { id: provider_acceptance_policy, primitiveFamily: policies }
        - { id: provider_ecosystem_observation, primitiveFamily: observations }
    # Architecture governance
    - id: govern_omniseed_architecture
      name: Govern OmniSeed Architecture
      description: Maintain implementation-independent contracts, architectural decisions, compatibility boundaries, and coherent evolution across the ecosystem.
      requires:
        - { id: architecture_governance_agency, primitiveFamily: agents }
        - { id: architecture_and_contract_design, primitiveFamily: skills }
        - { id: architecture_decision_process, primitiveFamily: workflows }
        - { id: architecture_invariants, primitiveFamily: policies }
        - { id: architecture_conformance_observation, primitiveFamily: observations }
        - { id: architecture_decision_memory, primitiveFamily: memory }
    # Research and experimentation
    - id: conduct_research_and_experiments
      name: Conduct Research and Experiments
      description: Investigate technical and business hypotheses through bounded, ethical experiments and retain reusable findings.
      autonomy: { mode: experiment }
      requires:
        - { id: research_agency, primitiveFamily: agents }
        - { id: research_and_experiment_design, primitiveFamily: skills }
        - { id: research_source_access, primitiveFamily: connectors }
        - { id: experiment_governance, primitiveFamily: workflows }
        - { id: research_ethics_and_risk_policy, primitiveFamily: policies }
        - { id: research_knowledge, primitiveFamily: memory }
    # Security, risk, privacy, and compliance
    - id: manage_security_risk_privacy_and_compliance
      name: Manage Security, Risk, Privacy, and Compliance
      description: Identify and treat security, operational, privacy, and compliance risks while preserving accountable evidence.
      requires:
        - { id: risk_management_agency, primitiveFamily: agents }
        - { id: security_privacy_and_compliance, primitiveFamily: skills }
        - { id: risk_treatment_process, primitiveFamily: workflows }
        - { id: security_privacy_compliance_policy, primitiveFamily: policies }
        - { id: control_effectiveness_observation, primitiveFamily: observations }
        - { id: risk_register_memory, primitiveFamily: memory }
        - { id: accountable_risk_identity, primitiveFamily: identity }
    # Documentation and education
    - id: produce_documentation_and_education
      name: Produce Documentation and Education
      description: Create, maintain, teach, and assess accurate learning paths for users, contributors, operators, and Providers.
      requires:
        - { id: documentation_education_agency, primitiveFamily: agents }
        - { id: technical_writing_and_instruction, primitiveFamily: skills }
        - { id: documentation_source_access, primitiveFamily: connectors }
        - { id: documentation_review_and_release, primitiveFamily: workflows }
        - { id: learning_effectiveness_observation, primitiveFamily: observations }
        - { id: education_knowledge, primitiveFamily: memory }
    # Publishing and communications
    - id: publish_content_and_communications
      name: Publish Content and Communications
      description: Operate truthful public publishing, announcements, website content, release communications, and stakeholder updates.
      requires:
        - { id: publishing_agency, primitiveFamily: agents }
        - { id: editorial_and_communications, primitiveFamily: skills }
        - { id: publishing_channel_access, primitiveFamily: connectors }
        - { id: editorial_review_and_publish, primitiveFamily: workflows }
        - { id: communications_policy, primitiveFamily: policies }
        - { id: publishing_observation, primitiveFamily: observations }
    # Community and open source
    - id: grow_open_source_community
      name: Grow Open Source Community
      description: Welcome, support, govern, recognise, and retain healthy participation across OmniSeed's open-source projects.
      requires:
        - { id: community_agency, primitiveFamily: agents }
        - { id: community_and_contribution_management, primitiveFamily: skills }
        - { id: community_channel_access, primitiveFamily: connectors }
        - { id: contribution_and_moderation_process, primitiveFamily: workflows }
        - { id: community_conduct_policy, primitiveFamily: policies }
        - { id: community_health_observation, primitiveFamily: observations }
        - { id: contributor_identity, primitiveFamily: identity }
    # Partnerships and ecosystem development
    - id: develop_partnerships_and_ecosystem
      name: Develop Partnerships and Ecosystem
      description: Form and manage aligned technology, distribution, research, and delivery relationships with accountable mutual outcomes.
      requires:
        - { id: partnership_agency, primitiveFamily: agents }
        - { id: partnership_development, primitiveFamily: skills }
        - { id: partner_relationship_access, primitiveFamily: connectors }
        - { id: partnership_lifecycle, primitiveFamily: workflows }
        - { id: partnership_authority_policy, primitiveFamily: policies }
        - { id: partnership_outcome_observation, primitiveFamily: observations }
        - { id: partner_context, primitiveFamily: memory }
    # Accelerator and founder programmes
    - id: operate_accelerator_programmes
      name: Operate Accelerator Programmes
      description: Design and run accountable programmes that help founders and teams build ecosystem-compatible companies and products.
      requires:
        - { id: programme_operations_agency, primitiveFamily: agents }
        - { id: accelerator_programme_design, primitiveFamily: skills }
        - { id: applicant_and_cohort_access, primitiveFamily: connectors }
        - { id: selection_and_cohort_delivery, primitiveFamily: workflows }
        - { id: programme_fairness_policy, primitiveFamily: policies }
        - { id: programme_outcome_observation, primitiveFamily: observations }
        - { id: programme_knowledge, primitiveFamily: memory }
    # Customer operations
    - id: onboard_support_and_retain_customers
      name: Onboard, Support, and Retain Customers
      description: Help users and customers adopt OmniSeed successfully, resolve needs, and achieve durable outcomes across their lifecycle.
      requires:
        - { id: customer_operations_agency, primitiveFamily: agents }
        - { id: onboarding_success_and_support, primitiveFamily: skills }
        - { id: customer_service_access, primitiveFamily: connectors }
        - { id: customer_lifecycle_process, primitiveFamily: workflows }
        - { id: customer_data_and_service_policy, primitiveFamily: policies }
        - { id: customer_outcome_observation, primitiveFamily: observations }
        - { id: customer_context, primitiveFamily: memory }
        - { id: customer_service_identity, primitiveFamily: identity }
    # Marketing and demand generation
    - id: generate_market_demand
      name: Generate Market Demand
      description: Understand target audiences and run measurable, truthful programmes that create awareness, interest, and qualified demand.
      requires:
        - { id: marketing_agency, primitiveFamily: agents }
        - { id: market_insight_and_demand_generation, primitiveFamily: skills }
        - { id: marketing_channel_access, primitiveFamily: connectors }
        - { id: campaign_lifecycle, primitiveFamily: workflows }
        - { id: marketing_claims_and_consent_policy, primitiveFamily: policies }
        - { id: demand_observation, primitiveFamily: observations }
        - { id: market_knowledge, primitiveFamily: memory }
    # Sales and commercial operations
    - id: manage_sales_revenue_and_commercial_operations
      name: Manage Sales, Revenue, and Commercial Operations
      description: Qualify opportunities, form suitable commercial agreements, manage revenue operations, and forecast without assuming a single business model.
      requires:
        - { id: commercial_agency, primitiveFamily: agents }
        - { id: sales_and_revenue_operations, primitiveFamily: skills }
        - { id: commercial_relationship_access, primitiveFamily: connectors }
        - { id: opportunity_to_revenue_process, primitiveFamily: workflows }
        - { id: commercial_authority_policy, primitiveFamily: policies }
        - { id: commercial_performance_observation, primitiveFamily: observations }
        - { id: commercial_context, primitiveFamily: memory }
        - { id: commercial_actor_identity, primitiveFamily: identity }
    # Finance, accounting, and procurement
    - id: manage_finance_accounting_and_procurement
      name: Manage Finance, Accounting, and Procurement
      description: Plan and control cash, budgets, accounting, tax, purchasing, and financial reporting with appropriate separation of duties.
      requires:
        - { id: finance_operations_agency, primitiveFamily: agents }
        - { id: finance_accounting_and_procurement, primitiveFamily: skills }
        - { id: financial_system_access, primitiveFamily: connectors }
        - { id: financial_control_process, primitiveFamily: workflows }
        - { id: financial_authority_policy, primitiveFamily: policies }
        - { id: financial_observation, primitiveFamily: observations }
        - { id: financial_records, primitiveFamily: memory }
        - { id: accountable_finance_identity, primitiveFamily: identity }
    # Legal, corporate administration, IP, and licensing
    - id: manage_legal_corporate_ip_and_licensing
      name: Manage Legal, Corporate, IP, and Licensing
      description: Maintain corporate obligations, contracts, intellectual property, open-source licensing, and legally accountable records.
      requires:
        - { id: legal_administration_agency, primitiveFamily: agents }
        - { id: legal_corporate_ip_and_licensing, primitiveFamily: skills }
        - { id: legal_information_access, primitiveFamily: connectors }
        - { id: legal_review_and_records_process, primitiveFamily: workflows }
        - { id: legal_and_licensing_policy, primitiveFamily: policies }
        - { id: legal_obligation_observation, primitiveFamily: observations }
        - { id: corporate_legal_records, primitiveFamily: memory }
        - { id: authorised_legal_identity, primitiveFamily: identity }
    # People and contributors
    - id: develop_people_and_contributors
      name: Develop People and Contributors
      description: Plan capacity, recruit or onboard suitable participants, support learning and wellbeing, and manage fair contributor lifecycles.
      requires:
        - { id: people_operations_agency, primitiveFamily: agents }
        - { id: people_contributor_and_learning_management, primitiveFamily: skills }
        - { id: people_system_access, primitiveFamily: connectors }
        - { id: people_lifecycle_process, primitiveFamily: workflows }
        - { id: fair_people_practices_policy, primitiveFamily: policies }
        - { id: people_outcome_observation, primitiveFamily: observations }
        - { id: people_context, primitiveFamily: memory }
        - { id: participant_identity, primitiveFamily: identity }
    # Analytics, measurement, and knowledge
    - id: measure_business_and_manage_knowledge
      name: Measure Business and Manage Knowledge
      description: Define trustworthy measures, analyse performance, preserve organisational knowledge, and make evidence available for decisions.
      requires:
        - { id: analytics_knowledge_agency, primitiveFamily: agents }
        - { id: analytics_measurement_and_knowledge, primitiveFamily: skills }
        - { id: governed_data_access, primitiveFamily: connectors }
        - { id: measurement_and_knowledge_process, primitiveFamily: workflows }
        - { id: data_governance_policy, primitiveFamily: policies }
        - { id: business_measurement_observation, primitiveFamily: observations }
        - { id: organisational_knowledge, primitiveFamily: memory }
    # Incident management and business continuity
    - id: respond_to_incidents_and_ensure_continuity
      name: Respond to Incidents and Ensure Continuity
      description: Prepare for disruption, coordinate response and recovery, communicate responsibly, and learn from incidents.
      requires:
        - { id: incident_response_agency, primitiveFamily: agents }
        - { id: incident_response_and_continuity, primitiveFamily: skills }
        - { id: operational_response_access, primitiveFamily: connectors }
        - { id: incident_and_recovery_process, primitiveFamily: workflows }
        - { id: incident_authority_policy, primitiveFamily: policies }
        - { id: resilience_observation, primitiveFamily: observations }
        - { id: incident_learning_memory, primitiveFamily: memory }
        - { id: incident_commander_identity, primitiveFamily: identity }
  realisations:
    - id: lily_stewardship
      name: Lily reference stewardship
      capability: steward_omniseed_ecosystem
      participants:
        - { resource: lily, role: steward, supplies: [stewardship_agency] }
        - { resource: stewardship_skills, supplies: [company_reasoning] }
        - { resource: omniseed_os, supplies: [governed_operations_access] }
        - { resource: company_change_workflow, supplies: [governed_change_process] }
        - { resource: lily_authority, supplies: [stewardship_authority] }
        - { resource: company_observer, supplies: [company_state_observation] }
        - { resource: ecosystem_memory, supplies: [organisational_context] }
        - { resource: lily_identity, supplies: [steward_identity] }
        - resource: lily_inference
          supplies:
            - stewardship_inference
    - id: engine_development
      name: Engine development, review, and release
      capability: maintain_omniseed_engine
      participants:
        - { resource: ecosystem_contributors, supplies: [engineering_agency] }
        - { resource: engineering_skills, supplies: [software_engineering] }
        - { resource: github_repositories, supplies: [repository_access] }
        - { resource: github_change_workflow, supplies: [software_change_manage] }
        - { resource: review_policy, supplies: [required_review] }
        - { resource: change_observer, supplies: [change_observation] }
        - { resource: ecosystem_memory, supplies: [engineering_history] }
        - { resource: contributor_identities, supplies: [contributor_identity] }
    - id: public_conformance
      name: Public ecosystem conformance
      capability: validate_ecosystem_conformance
      participants:
        - { resource: conformance_runner, supplies: [conformance_skill] }
        - { resource: github_repositories, supplies: [public_repository_access] }
        - { resource: github_conformance_workflow, supplies: [conformance_workflow] }
        - { resource: invariant_catalogue, supplies: [invariant_policy] }
        - { resource: conformance_observer, supplies: [conformance_observation] }
    - id: omniseed_os_interface
      name: OmniSeed OS human interface
      capability: operate_omniseed_ecosystem
      participants:
        - { resource: omniseed_os, role: human_interface, supplies: [human_operating_interface] }
        - { resource: operator_identities, supplies: [operator_identity] }
        - { resource: interface_policy, supplies: [interface_authority] }
        - { resource: os_observer, supplies: [interface_health_observation] }
    - id: ecosystem_reconciliation
      name: Git-governed OmniSeed reconciliation
      capability: reconcile_omniseed_ecosystem
      participants:
        - { resource: ecosystem_reconciliation_workflow, supplies: [approved_desired_state_resolution, deterministic_reconciliation] }
        - { resource: omniseed_os, supplies: [provider_operation_boundary] }
        - { resource: reconciliation_policy, supplies: [reconciliation_authority] }
        - { resource: engine_runtime_state, supplies: [runtime_state_continuity] }
        - { resource: reconciliation_observer, supplies: [reconciliation_observation] }
        - { resource: reconciler_identity, supplies: [reconciler_identity] }
  resources:
    agents:
      - id: lily
        name: Lily
        provider: vercel
        offers: [stewardship_agency]
        risk: high
        spec:
          authority:
            - company.read
            - capability.read
            - realisation.read
            - provider_binding.read
            - activity.read
            - company_change.propose
            - company_change.read
            - company_change.apply
            - company_change.merge
            - plan.create
            - plan.read
            - plan.apply
            - state.reconcile
            - company_work.create
            - company_work.read
            - company_work.record
            - company_work.cancel
          bootstrap:
            company: omniseed_ecosystem
            credentialReference: OMNISEED_OPERATION_TOKEN
            identity: lily
            omniseedEndpoint: https://omniseed-ecosystem-os.vercel.app
            runtimeModelConfiguration: LILY_MODEL
          implementation:
            framework: eve
            model: gemini-2.5-flash
            repository: https://github.com/mikeajijola/omniseed-lily.git
            repositoryId: 1335525492
            revision: c1b402c9342c5b33e9c45878219c8df39400913c
          kind: ai_agent
          organisationalIdentity: lily
          runtime:
            environment: production
            expectedEndpoints:
              health: https://omniseed-ecosystem-os.vercel.app/health
              info: https://omniseed-ecosystem-os.vercel.app/info
              operation: https://omniseed-ecosystem-os.vercel.app/eve/v1/session
            project: omniseed-ecosystem-os
            provider: vercel
            providerRevision: 40696040fb9fe954afe271189063a13f9aeec1b9
            observationCredentialReference: LILY_RUNTIME_OBSERVATION_TOKEN
            source:
              repository: https://github.com/mikeajijola/omniseedos.git
              repositoryId: 1326313594
              revision: 2c9650c283ba0ee40e747400499c7090460ff499
            secretReferences:
              - DATABASE_URL
              - OMNISEED_OPERATION_TOKEN
              - OMNISEED_OPERATOR_TOKEN
              - OMNISEED_STATE_TOKEN
              - LILY_SESSION_JWT_SECRET
              - LILY_RUNTIME_OBSERVATION_TOKEN
              - GITHUB_PROVIDER_TOKEN
              - GOOGLE_GENERATIVE_AI_API_KEY
            session:
              credentialReference: LILY_SESSION_JWT_SECRET
              issuer: omniseed
              audience: omniseed-lily
              subject: omniseed-os:omniseed_ecosystem
            services:
              - functions
      - { id: ecosystem_contributors, name: Ecosystem Contributors, offers: [engineering_agency], spec: { kind: people_and_agents } }
    skills:
      - { id: stewardship_skills, name: Stewardship Skills, provider: omniseed, offers: [company_reasoning], spec: { abilities: [inspect, reason, explain, propose, delegate, escalate] } }
      - { id: engineering_skills, name: Software Engineering Skills, provider: omniseed, offers: [software_engineering] }
      - { id: conformance_runner, name: Ecosystem Conformance Runner, provider: omniseed, offers: [conformance_skill] }
    connectors:
      - { id: github_repositories, name: Public Repository Boundary, provider: github, offers: [repository_access, public_repository_access] }
      - id: omniseed_os
        name: OmniSeed OS
        provider: vercel
        offers:
          - human_operating_interface
          - governed_operations_access
          - provider_operation_boundary
        spec:
          access:
            stewardChat: public
          secretReferences:
            - LILY_SESSION_JWT_SECRET
            - GITHUB_PROVIDER_TOKEN
          companyBinding:
            companyId: omniseed_ecosystem
            path: omniform.yaml
            readOnlyInspection: false
            repository: https://github.com/mikeajijola/omniseed-ecosystem-company.git
            stewardActorId: lily
          durableState:
            credentialReferences:
              - DATABASE_URL
              - OMNISEED_STATE_TOKEN
              - OMNISEED_OPERATOR_TOKEN
              - OMNISEED_OPERATION_TOKEN
            endpoint: https://omniseed-ecosystem-os.vercel.app/api/state
            implementationRevision: 2c9650c283ba0ee40e747400499c7090460ff499
            provider: neon
            service: postgresql
          environment: production
          expectedEndpoints:
            company: https://omniseed-ecosystem-os.vercel.app/api/company
            health: https://omniseed-ecosystem-os.vercel.app/api/health
            operations: https://omniseed-ecosystem-os.vercel.app
          optional: true
          implementation:
            package: "@omniseed/os"
            version: 1.0.0-alpha.39
          project: omniseed-ecosystem-os
          provider: vercel
          providerRevision: 40696040fb9fe954afe271189063a13f9aeec1b9
          services:
            - functions
            - deployment
          source:
            repository: https://github.com/mikeajijola/omniseedos.git
            repositoryId: 1326313594
            revision: 2c9650c283ba0ee40e747400499c7090460ff499
    workflows:
      - id: company_change_workflow
        name: Company Change Workflow
        provider: github
        offers: [governed_change_process]
        spec:
          provider: github
          providerRevision: b1e1a42883a2c0f3e439d340eff0816ca02d3025
          products: [Repositories, Pull Requests, Checks, Apps/API]
          repository: mikeajijola/omniseed-ecosystem-company
          baseBranch: main
          path: omniform.yaml
          branchPrefix: omniseed/
          credentialReference: GITHUB_PROVIDER_TOKEN
          mergePolicy:
            requireApproval: true
            requirePassingChecks: true
            trustedApprovalChecks:
              - { name: governed-company-change-approval, appSlug: github-actions }
            mergeMethod: squash
      - { id: github_change_workflow, name: GitHub Change Workflow, provider: github, offers: [software_change_manage] }
